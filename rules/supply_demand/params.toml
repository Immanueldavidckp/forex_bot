# Supply & Demand (V5): the numbers of concept.md + trade.md, as the V5 engine trades them on 2026-11-01.
#
# NOTE: the running engine still reads engine/config.py (STRATEGY / FILTERS / FILTER_PROFILES["profit"]) and
# engine/profit.py, NOT this file. tests/test_architecture.py fails if the two disagree, so a change in one place
# cannot go unnoticed until the V5 concepter is moved to read this file.

[strategy]
name = "supply_demand"
version = "5.0"
status = "demo"
timeframes = ["M15", "M30"]          # + the S&D H4 entry, traded on M15
filter_profile = "profit"

[structure]
swing_length = 2
major_swing_length = 4
bias_tfs = ["H4", "H1"]
bias_exempt_tfs = ["M15", "M30"]
setup_max_age_bars = 192

[zone]
lookback_bars = 5
displacement_mult = 1.5
body_average_bars = 10

[fvg]
pick = "nearest"
protect_candles = 2
min_runoff_atr = 0.5

[entry]
fvg_depth = 0.10
confirm_tf = "M5"
confirm_max_bars = 36

[layer]
depth_weak = 0.25
depth_moderate = 0.40
depth_strong = 0.55

[stops]
sl_buffer_points = 20
sdh4_sl_atr_buffer = 0.25
sl_min_spread_x = 3.0
sl_max_atr = 3.0
min_rr = 2.0                         # profile "profit" (the V5 text says 3.0)

[manage]
near_target_progress = 0.80
reversal_giveback = 0.10
tp1_fraction = 0.5
lock_start_r = 3.0
lock_gap_r = 2.0

[exit]
flat_before_utc = "20:45"

[filters]                            # the gates in engine/filters.py + engine/profit.py, profile "profit"
setup_expiry_m15_bars = 12
sl_widen_to_stops_level = true
max_spread_atr = 0.10                # symbol cost gate G9: median spread / ATR(14, M15)
min_target_spread_x = 10.0
rollover_utc = ["20:45", "22:15"]    # no entries inside
