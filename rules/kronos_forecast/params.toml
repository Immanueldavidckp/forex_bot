# Kronos forecast: as engine/config.py KRONOS holds it on 2026-11-01 (that file is what runs; the test keeps both equal).

[strategy]
name = "kronos_forecast"
version = "1.1"
status = "forecast-only"
timeframes = ["M15"]

[forecast]
context = 512
horizon = 8
paths = 16
p_min = 0.75
min_move_spread_x = 2.0
signal_max_age_sec = 600

[stops]
atr_period = 14
sl_atr = 1.0
tp_atr = 2.0
max_spread_sl = 0.3

[exit]
hold_bars = 8
min_free_margin_pct = 30
friday_last_entry_utc = "19:30"
